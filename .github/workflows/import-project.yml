name: import-project

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/import-project.yml

permissions:
  contents: write

jobs:
  import-project:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Extract project payload
        shell: pwsh
        env:
          PROJECT_B64: |
            
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "project-import.zip"
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($env:PROJECT_B64))
          Expand-Archive -LiteralPath $archive -DestinationPath $env:GITHUB_WORKSPACE -Force
          Remove-Item -LiteralPath "$env:GITHUB_WORKSPACE/.github/workflows/import-project.yml" -Force

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Windows client
        shell: pwsh
        run: |
          Set-Location desktop
          ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: NewsDigest-Windows
          path: desktop/dist/NewsDigest.exe
          if-no-files-found: error

      - name: Commit imported project and client
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import full NewsDigest project and build Windows client"
          git push
