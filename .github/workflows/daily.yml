name: daily-news-digest

on:
  schedule:
    # UTC 02:30 = 北京时间 10:30。想换时间就改小时（北京时间 = UTC + 8）。
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      query:
        description: "可选：输入关键词立即搜索；留空则生成每日简报"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-news-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and push digest
        env:
          TZ: Asia/Shanghai
          FEED_OUT: latest.json
          BARK_KEY: ${{ secrets.BARK_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.DS }}
          QMSG_KEY: ${{ secrets.QMSG_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WECHAT_RSS_URL: ${{ vars.WECHAT_RSS_URL }}
          USER_PROFILE: ${{ vars.USER_PROFILE }}
          INTEREST_QUERIES: ${{ vars.INTEREST_QUERIES }}
          SEARCH_QUERY: ${{ github.event.inputs.query }}
        run: python fetch_news.py

      - name: Publish feed for desktop app
        if: success() && github.event.inputs.query == ''
        run: |
          set -euo pipefail
          test -f latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "chore: update latest digest" || true
          git push
